name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: input
    id: feature
    attributes:
      label: Feature
      description: One line.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What would you do with it?
    validations:
      required: true
